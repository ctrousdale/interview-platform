services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: interview_practice
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: interview
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview -d interview_practice"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=interview_practice;Username=interview;Password=interview
      PythonToolsUrl: http://python-tools:8080
    depends_on:
      db:
        condition: service_healthy
      python-tools:
        condition: service_started
    restart: unless-stopped

  python-tools:
    build: ./python-tools
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 64
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - backend
      - python-tools
    volumes:
      - frontend_tls:/etc/nginx/local-tls
    restart: unless-stopped

volumes:
  postgres_data:
  frontend_tls:
